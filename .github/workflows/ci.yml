name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Fails if pnpm-lock.yaml is out of sync with package.json — including a
      # missing `overrides:` block, which is what broke the Cloudflare Pages
      # build in #122.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
